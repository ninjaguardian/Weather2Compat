name: Validate

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            gradle.properties
            update.json

      - name: Verify mod version matches update.json
        shell: bash
        run: |
          set -euo pipefail
          
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
  
          if ! jq -e --arg version "$minecraft_version" --arg mod_version "$mod_version" \
            '.[$version][$mod_version] != null' update.json > /dev/null; then
            echo "::error::Version $mod_version does not exist in update.json[$minecraft_version]"
            exit 1
          fi
          
          promo_version=$(jq -er --arg key "${minecraft_version}-latest" '.promos[$key]' update.json)

          if [[ "$mod_version" != "$promo_version" ]]; then
            echo "::error::Version mismatch: gradle.properties=$mod_version, update.json=$promo_version"
            exit 1
          fi

          echo "Version check passed: Minecraft $minecraft_version - $mod_version"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build
